<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Dois | Layane Santos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --bg-alt: #1e293b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0ea5e9;
      --border: #334155;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    .projeto-card {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 32px;
      transition: all 0.3s;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .projeto-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
    }

    .projeto-img {
      font-size: 4rem;
      margin-bottom: 24px;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 16px;
      color: var(--text);
    }

    p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 32px;
    }

    .tags {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .tags span {
      font-size: 0.85rem;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 600;
    }

    .btn-voltar {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.2s;
      background: var(--accent);
      color: #0f172a;
    }

    .btn-voltar:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="projeto-card">
      <div class="projeto-img">🛒</div>
      <h2>Projeto Dois</h2>
      <p>Descrição breve do projeto. Tecnologias usadas e o problema que resolve.</p>
      
      <div class="tags">
        <span>Node.js</span>
        <span>MongoDB</span>
      </div>

      <!-- O link abaixo volta para a página principal do seu site -->
      <a href="index.html" class="btn-voltar">← Voltar para o Portfólio</a>
    </div>
  </div>

</body>
</html>
